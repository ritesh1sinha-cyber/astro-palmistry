org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The only place the app's server is named. Change this line and rebuild to point
# the app somewhere else; an http:// value also flips on cleartext traffic and
# relaxes mixed content, which a LAN dev box needs and the public site must not
# have.
graharekha.baseUrl=https://www.graharekha.com/

# AGP 8.5.2 warns about compileSdk 36; Play requires targetSdk 36. Suppress noise.
android.suppressUnsupportedCompileSdk=36
