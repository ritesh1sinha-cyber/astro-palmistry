# Render blueprint — a real container host, so the engines and the long-running
# workers both work. This is the closest thing to your eventual VM.
services:
  - type: web
    name: astro-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile   # engines included; runs API + inline worker
    plan: standard                                # 2 GB RAM: mediapipe needs room
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: INLINE_WORKER
        value: "1"                                # single service: API + workers together
      - key: INLINE_WORKER_THREADS
        value: "2"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: astro-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: astro-redis, property: connectionString }
      - key: ALLOWED_ORIGINS
        sync: false                               # set to your Vercel domain
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT

  - type: redis
    name: astro-redis
    plan: starter
    maxmemoryPolicy: noeviction                   # never evict queue keys

databases:
  - name: astro-db
    plan: basic-256mb
    postgresMajorVersion: "16"
