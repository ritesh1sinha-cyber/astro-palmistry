name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev — no engines needed for these tests)
        run: pip install -r requirements.dev.txt

      - name: Compile everything
        run: python -m compileall -q api.py worker.py core

      - name: Validate the Postgres schema
        run: |
          pip install sqlglot
          python - <<'PY'
          import re, sqlglot
          sql = open('core/schema.sql').read()
          body = re.sub(r'\$\$.*?\$\$', "'body'", sql, flags=re.S)
          stmts = [s for s in sqlglot.parse(body, read='postgres') if s]
          print(f'{len(stmts)} statements parsed')
          PY

      - name: Queue unit tests (embedded Redis)
        env:
          DATABASE_URL: sqlite:///./ci.db
          APP_SECRET: ci-only
          LOCAL_STORE: ./ci-storage
          CAP_FULL_REPORT: "2"
        run: |
          python - <<'PY'
          from core import queue as Q
          a = Q.enqueue(kind="full_report", user_id="free", payload={}, priority=5)
          b = Q.enqueue(kind="full_report", user_id="paid", payload={}, priority=1)
          assert Q.r().zrange(Q._q("heavy"), 0, -1)[0] == b["jobId"], "paid must be first"
          assert Q.claim("heavy", "w1") and Q.claim("heavy", "w2")
          assert Q.claim("heavy", "w3") is None, "cap must hold"
          print("queue invariants hold")
          PY

      - name: API boots and serves /health
        env:
          DATABASE_URL: sqlite:///./ci.db
          APP_SECRET: ci-only
          LOCAL_STORE: ./ci-storage
          INLINE_WORKER: "0"
        run: |
          uvicorn api:app --port 8099 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8099/health | tee /dev/stderr | grep -q '"ok":true'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f deploy/Dockerfile.api -t ap-api .
