<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palmistry Reader</title>
  <!-- report-ui-v10-fixed-labels -->
  <style>
    :root {
      --magenta: #b0106b;
      --heading: #0d47a1;
      --accent: #1b5e20;
      --text: #1a1a1a;
      --muted: #555;
      --bg: #f0f2f5;
      --card: #fff;
      --border: #dde2e8;
      --upload-bg: #151820;
      --upload-text: #e8ecf4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .upload-bar {
      background: var(--upload-bg);
      color: var(--upload-text);
      padding: 1rem 1.5rem;
      border-bottom: 3px solid var(--heading);
    }
    .upload-bar h1 { font-family: system-ui, sans-serif; font-size: 1.1rem; color: #c9d4ff; }
    .upload-bar p { font-family: system-ui, sans-serif; font-size: 0.82rem; color: #8b95a8; margin-top: 0.25rem; }
    .upload-inner {
      max-width: 56rem;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-top: 0.75rem;
    }
    .upload-inner label { font-family: system-ui, sans-serif; font-size: 0.75rem; color: #8b95a8; display: block; margin-bottom: 0.2rem; }
    .upload-inner input[type=file] { font-size: 0.8rem; max-width: 11rem; color: #ccc; }
    .upload-inner select, .upload-inner button {
      font-family: system-ui, sans-serif;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .upload-inner select { background: #12151c; border: 1px solid #333; color: #eee; }
    button.primary { background: #3d5a9a; color: #fff; border: none; cursor: pointer; font-weight: 600; }
    button.primary:disabled { opacity: 0.5; }
    button.ghost { background: transparent; border: 1px solid #444; color: #aaa; cursor: pointer; }
    #status {
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      padding: 0.5rem 1.5rem;
      display: none;
    }
    #status.show { display: block; }
    #status.ok { background: #e8f5e9; color: var(--accent); }
    #status.err { background: #ffebee; color: #c62828; }
    #status.busy { background: #e3f2fd; color: var(--heading); }

    .report-wrap { max-width: 52rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .report-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem 1.75rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      margin-bottom: 1.25rem;
    }
    .meta { color: var(--magenta); font-size: 0.95rem; margin-bottom: 1rem; }
    .meta dt { font-weight: bold; margin-top: 0.35rem; }
    .meta dd { margin: 0; }
    h1.report-title { font-size: 1.35rem; color: var(--heading); margin-bottom: 0.5rem; }
    h2 { font-size: 1.08rem; color: var(--heading); margin: 1.25rem 0 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
    h3 { font-size: 1rem; color: var(--heading); margin: 1rem 0 0.4rem; }
    .lead { font-size: 1rem; margin-bottom: 1rem; }
    .callout {
      background: #e8f4fd;
      border-left: 4px solid var(--heading);
      padding: 0.85rem 1rem;
      margin: 1rem 0;
      font-size: 0.95rem;
    }
    .callout-warn {
      background: #fff8e1;
      border-left: 4px solid #f9a825;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .palm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
    @media (max-width: 720px) { .palm-grid { grid-template-columns: 1fr; } }
    .palm-panel { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .palm-panel.active { border-color: var(--heading); box-shadow: 0 0 0 2px rgba(13,71,161,.15); }
    .palm-panel h3 {
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
      background: #f5f7fa;
      padding: 0.4rem 0.6rem;
      margin: 0;
      border-bottom: 1px solid var(--border);
    }
    .palm-panel.active h3 { background: #e3f2fd; color: var(--heading); }
    .palm-panel img { width: 100%; display: block; cursor: zoom-in; }
    table.facts {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      margin: 0.5rem 0 1rem;
    }
    table.facts th, table.facts td {
      border: 1px solid var(--border);
      padding: 0.4rem 0.5rem;
      vertical-align: top;
      text-align: left;
    }
    table.facts th { background: #e8f5e9; color: var(--accent); width: 38%; }
    .cat-block { margin: 0.75rem 0 1rem; }
    .cat-block h3 { font-size: 0.95rem; margin-bottom: 0.35rem; }
    .pred {
      background: #fafbfc;
      border-left: 3px solid var(--magenta);
      padding: 0.6rem 0.85rem;
      margin: 0.4rem 0;
      font-size: 0.9rem;
    }
    .pred-src {
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .snapshot-item { margin: 0.5rem 0; }
    .snapshot-item strong { color: var(--heading); }
    .note { font-size: 0.82rem; color: var(--muted); margin-top: 1rem; }
    .numbered-checklist { list-style: none; margin: 0.75rem 0 1rem; padding: 0; }
    .check-item {
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
      margin: 1rem 0;
      padding: 0.85rem 1rem;
      background: #f8f9fb;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .palm-num {
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      background: var(--heading);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    .check-body { flex: 1; min-width: 0; }
    .check-body strong { color: var(--heading); font-size: 1rem; }
    .item-quotes { margin: 0.55rem 0 0; }
    .item-quotes .pred {
      margin: 0.5rem 0;
      font-size: 0.88rem;
      padding: 0.5rem 0.65rem;
      background: #fff;
      border-left: 3px solid var(--magenta);
      border-radius: 4px;
    }
    .timing-block {
      background: #e8f4fd;
      border-left: 3px solid var(--heading);
      padding: 0.65rem 0.85rem;
      margin: 0.5rem 0;
      font-size: 0.88rem;
    }
    .conclusive-block {
      background: #e8f5e9;
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin: 0.65rem 0;
      font-size: 0.92rem;
    }
    .conclusive-block > strong { color: var(--accent); display: block; margin-bottom: 0.35rem; }
    .verdict-line { font-weight: 600; color: var(--text); margin: 0.35rem 0; line-height: 1.45; }
    .conclusion-line { color: var(--muted); margin: 0.35rem 0 0; line-height: 1.5; font-size: 0.88rem; }
    .pred-text {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .quote-num {
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--heading);
    }
    .badge {
      font-family: system-ui, sans-serif;
      display: inline-block;
      font-size: 0.7rem;
      background: var(--heading);
      color: #fff;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      margin-left: 0.35rem;
      vertical-align: middle;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      cursor: zoom-out;
    }
    .lightbox.show { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 92vh; border-radius: 4px; }
  </style>
</head>
<body>
  <header class="upload-bar">
    <div style="max-width:56rem;margin:0 auto">
      <h1>Palmistry Reader</h1>
      <p>Upload palms → CV measures lines & mounts → book rules matched (3,000+ from your 10 PDFs). Verify overlays before trusting text.</p>
      <div class="upload-inner">
        <div>
          <label>Right palm</label>
          <input type="file" id="right-file" accept="image/*" />
        </div>
        <div>
          <label>Left palm</label>
          <input type="file" id="left-file" accept="image/*" />
        </div>
        <div>
          <label>Dominant hand</label>
          <select id="active-hand">
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </div>
        <button class="primary" id="btn-analyze">Analyze</button>
        <button class="ghost" id="btn-download" title="Save this report as an HTML file" hidden>Download report</button>
        <button class="ghost" id="btn-rebuild" title="Re-scan OCR texts">Rebuild corpus</button>
      </div>
    </div>
  </header>
  <div id="status"></div>
  <div id="report" class="report-wrap" hidden></div>
  <div id="lightbox" class="lightbox"><img id="lightbox-img" alt="palm overlay" /></div>

  <script>
    const BOOK = {
      apprentice_to_pro_24: "Apprentice to Pro",
      case_studies_modern_50: "Modern Case Studies",
      easy_understanding_samudrik: "Easy Samudrik",
      palmistry_for_all: "Palmistry for All",
      palmistry_how_to_master: "Master Palmistry",
      practical_handbook_vol1: "Practical Handbook I",
      practical_handbook_vol2_marriage: "Practical Handbook II",
      principles_self_learning: "Self-Learning Principles",
      secrets_profession_popularity: "Profession & Popularity",
      succinct_palmistry: "Succinct Palmistry",
    };
    const CAT = {
      vitality: "Life & vitality",
      mind: "Head & mind",
      heart: "Heart & love",
      career: "Fate & career",
      mounts: "Mounts",
      fingers: "Fingers & shape",
      fame: "Sun & fame",
      travel: "Travel",
      remedies: "Remedies",
      general: "General",
    };

    const statusEl = document.getElementById("status");
    function status(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = "show " + type;
    }

    async function api(url, opts) {
      const r = await fetch(url, opts);
      const t = await r.text();
      let d;
      try { d = JSON.parse(t); } catch { throw new Error(t || r.statusText); }
      if (!r.ok) throw new Error(d.detail || r.statusText);
      return d;
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function renderQuote(q, num) {
      const src = q.book_label || BOOK[q.book] || q.book || "Book";
      const timingTag = q.is_timing_rule ? " · <em>timing rule</em>" : "";
      const score = q.score != null ? ` · match ${q.score}` : "";
      return `<div class="pred">
        <div class="pred-src"><span class="quote-num">Point ${num}</span> · ${esc(src)} · p.${q.page}${score}${timingTag}</div>
        <div class="pred-text">${esc(q.text || "")}</div>
      </div>`;
    }

    function renderChecklist(handData) {
      const list = handData.numbered_checklist || [];
      const missing = handData.not_detected || [];
      const q = handData.features?.quality || {};
      let html = "";
      if (q.grade) {
        html += `<p class="note">Photo quality: <strong>${esc(q.grade)}</strong> — not a numbered point.</p>`;
      }
      if (!list.length) {
        return html + `<p class="callout-warn">No findings detected clearly enough to number. Try a flatter palm photo with even light.</p>`;
      }
      html += `<p class="note">Match each <strong>dot on your palm</strong> to the same <strong>Point N</strong> below (number outside the photo).</p>`;
      html += `<ul class="numbered-checklist">` +
        list.map(it => {
          const n = it.num;
          const onPalm = it.x != null
            ? ` <span class="note">(dot <strong>${n}</strong> on palm)</span>`
            : ` <span class="note">(whole hand)</span>`;
          const conc = it.conclusive || {};
          const concHtml = conc.verdict
            ? `<div class="conclusive-block"><strong>Your reading — point ${n}</strong><p class="verdict-line">${esc(conc.verdict)}</p>${conc.conclusion ? `<p class="conclusion-line">${esc(conc.conclusion)}</p>` : ""}</div>`
            : "";
          const timingHtml = it.timing
            ? `<div class="timing-block"><strong>When on your palm:</strong> about age <strong>${it.timing.estimated_age}</strong></div>`
            : "";
          return `<li class="check-item">
            <span class="palm-num">${n}</span>
            <div class="check-body">
              <strong>Point ${n} — ${esc(it.title)}</strong>${onPalm}
              ${timingHtml}
              ${concHtml}
            </div>
          </li>`;
        }).join("") +
        `</ul>`;
      if (missing.length) {
        html += `<p class="note"><strong>Not on photo:</strong> ${missing.map(esc).join(", ")}.</p>`;
      }
      return html;
    }

    const AGREEMENT_BADGE = {
      reinforced: "Reinforced (both hands)",
      developed: "Developed beyond blueprint",
      latent: "Innate strength, under-used",
      one_hand: "Shows on one hand",
    };

    function renderConfluence(c) {
      if (!c) return "";
      const lines = (c.lines || []).map(li => `
        <li class="check-item">
          <div class="check-body">
            <strong>${esc(li.title)}</strong>
            <span class="badge" style="margin-left:0.4rem">${esc(AGREEMENT_BADGE[li.agreement] || li.agreement)}</span>
            <p class="verdict-line" style="margin:0.35rem 0 0">${esc(li.statement)}</p>
          </div>
        </li>`).join("");
      const mounts = (c.mounts || []).length
        ? `<h3>Mount confluence</h3><ul class="plain">${c.mounts.map(m => `<li>${esc(m.statement)}</li>`).join("")}</ul>`
        : "";
      const marks = (c.marks || []).length
        ? `<h3>Special marks (fish, cross, star, trident…)</h3><ul class="plain">${c.marks.map(m => `<li>${esc(m.statement)}</li>`).join("")}</ul>`
        : "";
      const preds = (c.predictions || []).map(p => `
        <div class="conclusive-block">
          <strong>${esc(p.title || "Reading")}${p.age != null ? ` — around age ${esc(p.age)}` : ""}</strong>
          <p class="verdict-line">${esc(p.text || "")}</p>
        </div>`).join("");
      return `
        <article class="report-card" style="border-left:4px solid var(--accent)">
          <h2>Confluence reading — both hands combined</h2>
          <p class="lead">${esc(c.summary)}</p>
          <h3>Major lines (left + right synthesis)</h3>
          <ul class="check-list">${lines}</ul>
          ${mounts}
          ${marks}
          <h3>What this means for you</h3>
          ${preds || '<p class="note">No clear timed prediction could be drawn.</p>'}
        </article>`;
    }

    function renderReport(data) {
      const active = data.active_hand || "right";
      const right = data.right;
      const left = data.left;
      const primary = active === "left" ? left : right;
      const date = new Date().toISOString().slice(0, 10);

      let sections = "";
      for (const [label, handData, key] of [
        ["Right", right, "right"],
        ["Left", left, "left"],
      ]) {
        if (!handData) continue;
        const isActive = key === active;
        const p = handData.prediction || {};
        sections += `
          <article class="report-card">
            <h2>${label} palm ${isActive ? '<span class="badge">Dominant</span>' : '<span style="font-size:0.85rem;color:var(--muted);font-weight:normal">— innate blueprint</span>'}</h2>
            <div style="max-width:22rem;margin:0.5rem 0 1rem">
              <img src="${handData.overlay_url}?t=${Date.now()}" alt="${label}" style="width:100%;border:1px solid var(--border);border-radius:4px;cursor:zoom-in" data-zoom="1" />
              <p class="note" style="margin-top:0.35rem;text-align:center">Small <strong>dot</strong> on palm + number outside — same <strong>Point N</strong> below.</p>
            </div>
            <h3>Your numbered palm points</h3>
            ${renderChecklist(handData)}
          </article>`;
      }

      document.getElementById("report").innerHTML = `
        <article class="report-card">
          <h1 class="report-title">Palmistry analysis report</h1>
          <dl class="meta">
            <dt>Reading date</dt><dd>${date}</dd>
            <dt>Dominant hand</dt><dd>${active === "right" ? "Right" : "Left"} — lived patterns. Other hand = innate wiring.</dd>
            <dt>Corpus</dt><dd>${(primary && primary.prediction && primary.prediction.corpus_rules_total) || "?"} rules from 10 palmistry books</dd>
          </dl>
          <p class="lead">Each <strong>dot</strong> on your palm matches <strong>Point N</strong> in the report. Numbers outside the hand are the same points.</p>
        </article>
        ${renderConfluence(data.confluence)}
        ${data.confluence ? '<h2 style="margin:1.5rem 0 0.5rem;color:var(--muted)">Per-hand detail</h2>' : ''}
        ${sections}
        <p class="note">For learning and reflection only. Poor lighting or partial palm may miss the heart line — re-upload with fingers spread and palm flat.</p>
        ${data.reference_url ? `<p class="note dev-only" style="opacity:0.6">Developer reference (book sources): <a href="${data.reference_url}" target="_blank" rel="noopener">reference.txt</a></p>` : ""}
      `;
      document.getElementById("report").hidden = false;
      document.getElementById("btn-download").hidden = false;
      bindZoom();
    }

    async function imgToDataUrl(url) {
      try {
        const resp = await fetch(url);
        const blob = await resp.blob();
        return await new Promise((resolve) => {
          const fr = new FileReader();
          fr.onload = () => resolve(fr.result);
          fr.onerror = () => resolve(url);
          fr.readAsDataURL(blob);
        });
      } catch {
        return url;
      }
    }

    async function downloadReport() {
      const report = document.getElementById("report");
      if (!report || report.hidden) return;
      const btn = document.getElementById("btn-download");
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = "Preparing…";
      try {
        const clone = report.cloneNode(true);
        clone.querySelectorAll(".dev-only").forEach(el => el.remove());
        // Embed overlay images so the saved file works fully offline.
        const imgs = [...clone.querySelectorAll("img")];
        await Promise.all(imgs.map(async (img) => {
          const src = img.getAttribute("src");
          if (src) img.setAttribute("src", await imgToDataUrl(src));
          img.removeAttribute("data-zoom");
          img.style.cursor = "default";
        }));
        const css = document.querySelector("style")?.innerHTML || "";
        const date = new Date().toISOString().slice(0, 10);
        const doc =
          `<!doctype html><html lang="en"><head><meta charset="utf-8" />` +
          `<meta name="viewport" content="width=device-width, initial-scale=1" />` +
          `<title>Palmistry analysis report — ${date}</title>` +
          `<style>${css}\nbody{padding:1.5rem;}</style></head>` +
          `<body><div class="report-wrap">${clone.innerHTML}</div></body></html>`;
        const blob = new Blob([doc], { type: "text/html" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `palm-report-${date}.html`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        status("Report downloaded", "ok");
      } catch (e) {
        status("Download failed: " + e.message, "err");
      } finally {
        btn.disabled = false;
        btn.textContent = prev;
      }
    }

    document.getElementById("btn-download").addEventListener("click", downloadReport);

    function bindZoom() {
      const lb = document.getElementById("lightbox");
      const img = document.getElementById("lightbox-img");
      document.querySelectorAll("[data-zoom]").forEach(el => {
        el.onclick = () => {
          img.src = el.src;
          lb.classList.add("show");
        };
      });
      lb.onclick = () => lb.classList.remove("show");
    }

    document.getElementById("btn-analyze").addEventListener("click", async () => {
      const rf = document.getElementById("right-file").files[0];
      const lf = document.getElementById("left-file").files[0];
      if (!rf && !lf) return status("Upload at least one palm image", "err");
      const btn = document.getElementById("btn-analyze");
      btn.disabled = true;
      status("Analyzing…", "busy");
      const fd = new FormData();
      if (rf) fd.append("right", rf);
      if (lf) fd.append("left", lf);
      fd.append("active_hand", document.getElementById("active-hand").value);
      try {
        const data = await api("/api/analyze/both", { method: "POST", body: fd });
        renderReport(data);
        status("Report ready — click any overlay to zoom", "ok");
        window.scrollTo({ top: document.getElementById("report").offsetTop - 8, behavior: "smooth" });
      } catch (e) {
        status(e.message, "err");
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("btn-rebuild").addEventListener("click", async () => {
      status("Rebuilding rule corpus…", "busy");
      try {
        const d = await api("/api/rebuild-corpus", { method: "POST" });
        status(`Corpus rebuilt: ${d.rule_count} rules`, "ok");
      } catch (e) {
        status(e.message, "err");
      }
    });

    fetch("/health").then(r => r.json()).then(d => {
      status(`Ready — ${d.rules_loaded} book rules loaded`, "ok");
    }).catch(() => {});
  </script>
</body>
</html>
